<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hospital TIC | Plataforma de gestión clínica</title>
    <meta name="description" content="Hospital TIC es una solución para gestionar dispositivos, alertas y métricas en hospitales con un panel intuitivo y seguro." />
    <meta name="theme-color" content="#38bdf8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Script de inicialización anti-FOUC para el modo oscuro/claro -->
    <script>
      (function() {
        var savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #f8fafc;
        color: #0f172a;
      }
      html[data-theme='dark'], body[data-theme='dark'] {
        background-color: #0f172a;
        color: #f8fafc;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      /* Fallback de carga mientras React inicializa */
      .app-loading-spinner {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-weight: 600;
        color: #0ea5e9;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div className="app-loading-spinner">
        Cargando Hospital TIC...
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
