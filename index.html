<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital San Jose</title>
    <style>
      :root {
        --bg: #f4f9ff;
        --primary: #2f80ed;
        --primary-dark: #1f6feb;
        --card: #ffffff;
        --text: #1d3557;
      }
      body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: var(--bg); color: var(--text); }
      .container { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
      .hero, .card { background: var(--card); border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(31, 111, 235, 0.1); }
      .hero { margin-bottom: 20px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
      .module { padding: 18px; border: 1px solid #dceeff; border-radius: 12px; }
      form { display: grid; gap: 10px; }
      input, button { padding: 10px; border-radius: 10px; border: 1px solid #cfe2ff; font: inherit; }
      button { background: var(--primary); color: white; cursor: pointer; }
      button:hover { background: var(--primary-dark); }
      h1, h2 { margin-top: 0; }
    </style>
  </head>
  <body>
    <div class="container">
      <section class="hero">
        <h1>Hospital San Jose</h1>
        <p>Acceso seguro para el sistema de gestión hospitalaria.</p>
      </section>

      <section class="card module">
        <h2>Iniciar sesión</h2>
        <form id="login-form">
          <input name="username" placeholder="Usuario" required />
          <input name="password" type="password" placeholder="Contraseña" required />
          <button type="submit">Entrar</button>
        </form>
        <p id="status">Ingresa tus credenciales para continuar.</p>
      </section>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
